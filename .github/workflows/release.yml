name: Facial Emotion Recognition Release

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "CHANGELOG.md"
      - "RELEASE_NOTES_v0.2.0.md"

permissions:
  contents: read

concurrency:
  group: fer-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify semantic tag, package version, and changelog
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semantic-version tag: $tag" >&2
            exit 1
          fi
          version="${tag#v}"
          grep -Fq "version = \"$version\"" pyproject.toml
          grep -Fq "## [$version]" CHANGELOG.md

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=83"
          pip install -e ".[dev]"

      - name: Run quality and tests
        run: |
          ruff format --check src/api/validation.py src/src/config/settings.py src/src/rag/context_retriever.py src/research tests/production
          ruff check src/api/validation.py src/src/config/settings.py src/src/rag/context_retriever.py tests/production
          mypy
          pytest

      - name: Build Python distributions
        run: |
          python -m pip install build
          python -m build

      - name: Build application container
        run: docker build -t facial-emotion-recognition-system:${{ github.sha }} .

      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES_v0.2.0.md
          generate_release_notes: false
          files: dist/*

  publish-container:
    name: Publish GHCR image
    if: startsWith(github.ref, 'refs/tags/')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/coreyleath-code/facial-emotion-recognition-system
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
